<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Rehan Tariq">
    <meta name="description" content="Contact the European Soccer Explorer website.">

    <title>Contact | European Soccer Explorer</title>

    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    <link rel="shortcut icon" href="img/favicon.ico">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">

            <a class="logo" href="index.html">
                European Soccer Explorer
            </a>

            <ul class="nav-links">
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="explore.html">Explore</a>
                </li>

                <li>
                    <a href="info.html">Soccer Info</a>
                </li>

                <li>
                    <a class="active" href="contact.html">Contact</a>
                </li>

                <li>
                    <a href="index.html#login-signup" class="login-link">
                        Login / Sign Up
                    </a>
                </li>
            </ul>

        </nav>
    </header>


    <main>

        <section class="choice-section">

            <div class="choice-heading">

                <p class="eyebrow">
                    Contact
                </p>

                <h1>Contact Us</h1>

                <p>
                    Have a question or suggestion about the European
                    Soccer Explorer? Send us a message below.
                </p>

            </div>

        </section>


        <section class="contact-section">

            <form class="contact-form">

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>

                </div>


                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required>

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required></textarea>

                </div>


                <button class="button" type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <footer class="site-footer">

        <p>
            &copy; 2026 Rehan Tariq | European Soccer Club Explorer
        </p>

    </footer>

</body>

</html>
